    const tl = gsap.timeline({ paused: true });

    tl.fromTo(".c2tick", { opacity: 0 }, { opacity: 1, duration: 0.2, stagger: 0.025 }, 0.4);
    tl.fromTo("#c2marker", { x: 360, y: 595 }, { x: 1380, y: 595, duration: 1.6, ease: "power2.inOut" }, 1.2);
    tl.fromTo("#c2rtxt", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 2.0);
    tl.to(["#c2ruler", "#c2rtxt"], { opacity: 0, duration: 0.3 }, 3.7);
    tl.to("#c2ttl1", { y: 0, duration: 0.6, ease: "power3.inOut" }, 3.8);

    // ---- scene 2 (4.06-8.7): ten outputs, then the targets ----
    tl.fromTo("#c2pill", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 4.1);
    tl.fromTo("#c2leg", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 4.1);
    OUT.forEach((o, i) => {
      tl.fromTo("#c2d" + i, { opacity: 0 }, { opacity: 1, duration: 0.3 }, 4.2 + i * 0.07);
      tl.fromTo("#c2o" + i, { opacity: 1, scaleY: 0 }, { opacity: 1, scaleY: Math.max(o, 0.015), duration: 0.6, ease: "power3.out" }, 4.3 + i * 0.1);
      tl.fromTo("#c2t" + i, { opacity: 1, scaleY: 0 }, { opacity: 1, scaleY: Math.max(TGT[i], 0.015), duration: 0.6, ease: "power3.out" }, 6.2 + i * 0.08);
    });
    tl.to("#c2d7", { color: ACC, duration: 0.3 }, 7.3);

    // ---- scene 3 (8.95-12.7): gaps, then squares ----
    OUT.forEach((o, i) => {
      tl.fromTo("#c2g" + i, { opacity: 1, scaleY: 0 }, { opacity: 1, scaleY: 1, duration: 0.5, ease: "power3.out" }, 9.0 + i * 0.06);
      tl.fromTo("#c2s" + i, { opacity: 1, scale: 0, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.7)" }, 10.4 + i * 0.07);
    });
    tl.fromTo("#c2sqlab", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 10.4);

    // ---- scene 4 (12.91-14.6): add them up ----
    OUT.forEach((o, i) => {
      const s = Math.abs(TGT[i] - OUT[i]) * SQ;
      tl.to("#c2s" + i, { x: 960 - cx(i), y: 700 - (640 + s / 2), scale: 0.4, opacity: 0, duration: 0.7, ease: "power2.in" }, 13.0 + i * 0.03);

    tl.to("#c2sqlab", { opacity: 0, duration: 0.2 }, 13.0);
    tl.fromTo("#c2block", { opacity: 0, scale: 0.3, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.8)" }, 13.7);
    tl.fromTo("#c2blocklab", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 13.9);

    // ---- scene 5 (14.85-20.96): one example, digit 7 ----
    tl.to(["#c2block", "#c2blocklab", "#c2leg"], { opacity: 0, duration: 0.3 }, 14.85);
    for (let i = 0; i < 10; i++) if (i !== 7) tl.to(["#c2d" + i, "#c2o" + i, "#c2t" + i, "#c2g" + i], { opacity: 0.12, duration: 0.4 }, 14.9);

    tl.fromTo("#c2v2", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 15.9);

    tl.to(["#c2cols", "#c2v1", "#c2v2", "#c2sq7", "#c2eq"], { opacity: 0, duration: 0.4 }, 21.2);

      const l = 470 + (i % 3) * 340, tp = 300 + Math.floor(i / 3) * 210;

      tl.to("#c2c" + i, { x: 960 - (l + 150), y: 450 - (tp + 85), scale: 0.3, opacity: 0, duration: 0.7, ease: "power2.in" }, 23.1 + i * 0.03);

    tl.fromTo("#c2more", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 22.4);
    tl.to("#c2more", { opacity: 0, duration: 0.3 }, 23.0);

    // ---- scene 7 (24.26-28.2): the cost ----
    tl.fromTo("#c2cost", { opacity: 0, scale: 0.6, textShadow: "0 0 0px rgba(0,229,160,0)" }, { opacity: 1, scale: 1, textShadow: "0 0 60px rgba(0,229,160,0.7)", duration: 0.7, ease: "back.out(1.6)" }, 24.3);
    tl.fromTo("#c2clab", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 24.9);
    tl.fromTo("#c2csub", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 25.8);

    // ---- scene 8 (28.4-31.5): millions of mistakes squeezed in ----
    tl.to(["#c2clab", "#c2csub"], { opacity: 0, duration: 0.3 }, 28.4);
    tl.to("#c2cost", { opacity: 0.2, duration: 0.3 }, 28.4);
    for (let i = 0; i < 48; i++) {
      const x = 160 + rnd() * 1580, y = 260 + rnd() * 560;
      mk("#c2dots", "c2dot", "c2dt" + i, `left:${x}px;top:${y}px`);
      tl.fromTo("#c2dt" + i, { opacity: 0, scale: 0 }, { opacity: 0.9, scale: 1, duration: 0.25, ease: "power3.out" }, 28.5 + i * 0.008);
      tl.to("#c2dt" + i, { x: 949 - x, y: 449 - y, opacity: 0, duration: 0.9, ease: "power3.in" }, 29.5 + i * 0.012);
    }
    tl.to("#c2cost", { opacity: 1, duration: 0.3 }, 30.5);

    tl.to("#c2goal", { opacity: 0, duration: 0.3 }, 34.5);

    // ---- scenes 10-13 (34.8-52): gradient descent ----
    const CX = 800, HW = 600, TOP = 360, BOT = 760;
    const Y = (x) => BOT - (BOT - TOP) * Math.pow((x - CX) / HW, 2);
    const U2 = (x) => Math.pow((x - CX) / HW, 2);
    let d = "";
    for (let x = CX - HW; x <= CX + HW; x += 20) d += (d ? "L" : "M") + x + " " + Y(x).toFixed(1) + " ";
    $("#c2curve").setAttribute("d", d);
    const st = { x: 200 };
    const ball = $("#c2ball"), costEl = $("#c2cost"), fill = $("#c2fill");
    const render = () => {
      ball.style.transform = `translate(${st.x - 18}px, ${Y(st.x) - 18}px)`;
      const c = 0.12 + 0.82 * U2(st.x);
      costEl.textContent = c.toFixed(2);
      fill.style.transform = `scaleX(${(c / 0.94).toFixed(3)})`;
    };
    const step = (x, t, dur) => tl.to(st, { x, duration: dur, ease: "power2.inOut", onUpdate: render }, t);
    tl.call(render, null, 0);
    tl.to("#c2ttl1", { opacity: 0, duration: 0.3 }, 34.8);
    tl.fromTo("#c2ttl2", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 35.0);

    tl.fromTo("#c2ball", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 35.4);

    tl.fromTo("#c2lg2", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 40.2);
    tl.fromTo("#c2arrDn", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 40.3);
    tl.to(["#c2arrUp", "#c2arrDn"], { opacity: 0, duration: 0.3 }, 41.6);
    step(330, 41.7, 0.8);
    tl.to(["#c2lg1", "#c2lg2"], { opacity: 0, duration: 0.3 }, 43.2);

    // scene 12: the loop, highlighted in step with the narration
    const lit = (id, t) => tl.to(id, { borderColor: ACC, color: "#e8eef5", duration: 0.2 }, t);
    const unlit = (id, t) => tl.to(id, { borderColor: DIM, color: DIM, duration: 0.2 }, t);
    tl.fromTo([".c2chip", ".c2arr"], { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out", stagger: 0.08 }, 43.5);
    lit("#c2k1", 45.3); step(440, 45.4, 0.8);
    unlit("#c2k1", 46.5); lit("#c2k2", 46.5); step(540, 46.6, 0.8);
    unlit("#c2k2", 47.6); lit("#c2k3", 47.6); step(630, 47.7, 0.8);
    unlit("#c2k3", 48.8); lit("#c2k4", 48.8); step(700, 48.9, 0.7);
    tl.to([".c2chip", ".c2arr"], { opacity: 0, duration: 0.3 }, 49.7);

    // scene 13: no more drop
    step(790, 50.1, 0.9);
    step(800, 51.0, 0.5);
    tl.fromTo("#c2stop", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 51.0);

    // ---- scene 14 (52.25-55.7): 13,000 weights, one score ----
    tl.to(["#c2chart", "#c2ball", "#c2stop", "#c2ttl2"], { opacity: 0, duration: 0.4 }, 52.0);
    const web = $("#c2web");
    for (let i = 0; i < 56; i++) {
      const x = 860 + rnd() * 500, y = 340 + rnd() * 490, w = 1 + rnd() * 4, col = [ACC, AMB, DIM][i % 3];
      web.insertAdjacentHTML("beforeend", `<line class="c2wl" x1="${x.toFixed(0)}" y1="${y.toFixed(0)}" x2="1610" y2="296" stroke="${col}" stroke-width="${w.toFixed(1)}" opacity="0"/><circle class="c2wl" cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="${(w + 3).toFixed(1)}" fill="${col}" opacity="0"/>`);
    }
    tl.fromTo(".c2wl", { opacity: 0 }, { opacity: 0.75, duration: 0.3, stagger: 0.012 }, 52.5);
    tl.fromTo("#c2w1", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 52.4);
    tl.fromTo("#c2w2", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 53.0);
