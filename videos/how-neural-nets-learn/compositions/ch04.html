    <!-- captions: one per sentence -->
    <div id="c4-cap01" class="clip cap" data-start="0" data-duration="2.97" data-track-index="5"><span>Now every weight knows which way to move, but not <b>how far</b>.</span></div>
    <div id="c4-cap02" class="clip cap" data-start="2.97" data-duration="2.73" data-track-index="5"><span>The gradient gives a direction, never a <b>distance</b>.</span></div>
    <div id="c4-cap03" class="clip cap" data-start="5.7" data-duration="5.68" data-track-index="5"><span>Picture the cost as terrain, and you as a hiker with a <b>blindfold</b> on, feeling the slope and stepping downhill.</span></div>
    <div id="c4-cap04" class="clip cap" data-start="11.38" data-duration="3.05" data-track-index="5"><span>If your step is too low, progress is steady but <b>slow</b>.</span></div>
    <div id="c4-cap05" class="clip cap" data-start="14.43" data-duration="4.14" data-track-index="5"><span>If it is too high, you go faster but it is riskier, and you can <b>leap over</b> the valley.</span></div>

    <div id="c4-cap09" class="clip cap" data-start="30.61" data-duration="3.63" data-track-index="5"><span>Instead the network looks at a small <b>batch</b> of data and steps from that.</span></div>

  <script>
    (function () {
      const ACC = "#00e5a0", AMB = "#ffb454", DIM = "#8a97a6", INK = "#e8eef5";
      const NS = "http://www.w3.org/2000/svg";
      const FMAX = 1.21;
      const f = (x) => ((x < 0.45 ? 2 : 4) * (x - 0.45) * (x - 0.45)) / FMAX + 0.025 * (1 + Math.sin(x * 38));
      let XMIN = 0.45;
      for (let x = 0.2, best = 9; x < 0.7; x += 0.001) if (f(x) < best) { best = f(x); XMIN = x; }

      const svgEl = (tag, attrs, parent) => {
        const e = document.createElementNS(NS, tag);
        Object.keys(attrs).forEach((k) => e.setAttribute(k, attrs[k]));
        parent.appendChild(e);
        return e;
      };
      const mk = (cls, id, parent) => {
        const d = document.createElement("div");
        d.className = cls; d.id = id; parent.appendChild(d);
        return d;
      };
      // panel mapping: x in 0..1 to pixels
      const mapper = (px0, w, base, h) => ({
        X: (x) => px0 + x * w,
        Y: (x) => base - f(x) * h,
      });
      const terrain = (svg, m, px0, w, base, color) => {
        let d = "";
        for (let i = 0; i <= 100; i++) d += (i ? "L" : "M") + m.X(i / 100).toFixed(1) + " " + m.Y(i / 100).toFixed(1);
        for (let k = 3; k >= 1; k--) {
          svgEl("path", { d, transform: "translate(0," + (-26 * k) + ")", fill: "none", stroke: "#2a3f52", "stroke-width": 2, opacity: 0.9 - k * 0.2 }, svg);
        }
        svgEl("path", { d: d + "L" + (px0 + w) + " " + (base + 40) + "L" + px0 + " " + (base + 40) + "Z", fill: "#101a25" }, svg);
        svgEl("path", { d, fill: "none", stroke: color, "stroke-width": 5, "stroke-linejoin": "round" }, svg);
      };

      // ---------- g2 geometry ----------
      const g2svg = document.getElementById("c4-g2-svg");
      const BASE2 = 790, H2 = 440;
      const mL = mapper(130, 760, BASE2, H2), mR = mapper(1030, 760, BASE2, H2);
      const g2L = svgEl("g", { id: "c4-g2-tl" }, g2svg), g2R = svgEl("g", { id: "c4-g2-tr" }, g2svg);
      terrain(g2L, mL, 130, 760, BASE2, ACC);
      terrain(g2R, mR, 1030, 760, BASE2, AMB);

      // ---------- g4 geometry ----------
      const g4svg = document.getElementById("c4-g4-svg");
      const BASE4 = 790, H4 = 440, m4 = mapper(120, 1680, BASE4, H4);
      terrain(svgEl("g", { id: "c4-g4-tg" }, g4svg), m4, 120, 1680, BASE4, ACC);

      // ---------- g6 geometry ----------
      const g6svg = document.getElementById("c4-g6-svg");
      const BASE6 = 790, H6 = 440, m6 = mapper(120, 1380, BASE6, H6);
      terrain(svgEl("g", { id: "c4-g6-tg" }, g6svg), m6, 120, 1380, BASE6, DIM);

      // ---------- g5 example grid ----------
      const grid = document.getElementById("c4-g5-grid");
      const COLS = 16, ROWS = 8, picked = [5, 19, 33, 42, 58, 66, 77, 85, 94, 103, 115, 122];
      for (let i = 0; i < COLS * ROWS; i++) {
        const d = mk("ex", "c4-ex" + i, grid);
        gsap.set(d, { x: 150 + (i % COLS) * 46, y: 272 + Math.floor(i / COLS) * 44 });
      }
      // ---------- g5 noisy arrows ----------
      const CX = 1400, CY = 420, TRUE = 35;
      const arrowsHost = document.getElementById("c4-g5-arrows");
      const noisy = [[-52, 150], [-30, 190], [-18, 170], [-6, 200], [14, 160], [28, 190], [48, 170], [66, 150]];
      noisy.forEach((n, i) => {
        const a = mk("arr amb", "c4-na" + i, arrowsHost);
        a.style.width = n[1] + "px";
        gsap.set(a, { x: CX, y: CY, rotation: TRUE + n[0], transformOrigin: "0% 50%" });
      });
      const avg = document.getElementById("c4-g5-avg");
      avg.style.width = "260px";
      gsap.set(avg, { x: CX, y: CY, rotation: TRUE, transformOrigin: "0% 50%" });
      const step5 = document.getElementById("c4-g5-step");
      step5.style.width = "110px";
      gsap.set(step5, { x: 900, y: 440, rotation: 0, transformOrigin: "0% 50%" });

      // ---------- g1 arrow ----------
      const a1 = document.getElementById("c4-g1-arr");
      a1.style.width = "150px";
      gsap.set(a1, { x: 610, y: 447, rotation: 0, transformOrigin: "0% 50%" });
      gsap.set("#c4-g1-dot", { x: 0, y: 0 });

      // ---------- g2 slope arrow ----------
      const slopeDeg = (Math.atan2(mL.Y(0.13) - mL.Y(0.12), mL.X(0.13) - mL.X(0.12)) * 180) / Math.PI;
      const slope = document.getElementById("c4-g2-slope");
      slope.style.width = "90px";
      gsap.set(slope, { x: mL.X(0.12) + 30, y: mL.Y(0.12) - 8, rotation: slopeDeg, transformOrigin: "0% 50%" });

      // ---------- g7 stairs ----------
      const stairs = document.getElementById("c4-g7-stairs");
      const NST = 32;
      for (let i = 0; i < NST; i++) {
        const d = mk("trail", "c4-st" + i, stairs);
        gsap.set(d, { x: 240 + i * 46, y: 500 + i * 7 + (i % 2 ? 0 : -14) });
      }

      // ---------- timeline ----------
      const tl = gsap.timeline({ paused: true });
      const IN = 0.5;
      const fade = (sel, t, y) => tl.fromTo(sel, { opacity: 0, y: y === undefined ? 20 : y }, { opacity: 1, y: 0, duration: IN, ease: "power3.out" }, t);
      const out = (sel, t) => tl.fromTo(sel, { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.in" }, t);
      const pop = (sel, t) => tl.fromTo(sel, { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2)" }, t);

      // g1
      fade("#c4-g1-t", 0.1);
      pop("#c4-g1-dot", 0.2);
      tl.fromTo("#c4-g1-arr", { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.6, ease: "power3.out" }, 0.6);
      fade("#c4-g1-dir", 0.9);
      tl.fromTo("#c4-g1-rule", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 1.6);
      fade("#c4-g1-how", 1.8);
      tl.fromTo("#c4-g1-q", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(2)" }, 1.9);
      tl.fromTo("#c4-g1-t", { color: INK }, { color: AMB, duration: 0.3 }, 2.97);
      pop("#c4-g1-c1", 3.1);
      pop("#c4-g1-c2", 4.0);
      out("#c4-g1", 5.4);

      // g2 (times relative to this file: g2 starts at 5.7)
      const T3 = 5.7;
      tl.fromTo("#c4-g2-tl,#c4-g2-tr", { opacity: 0 }, { opacity: 1, duration: 0.7, ease: "power2.out" }, T3);
      tl.fromTo("#c4-g2-split", { opacity: 0 }, { opacity: 1, duration: 0.5 }, T3);
      fade("#c4-g2-hl", T3 + 0.2); fade("#c4-g2-hr", T3 + 0.3);
      fade("#c4-g2-sl1", T3 + 0.5); fade("#c4-g2-sr1", T3 + 0.6);
      gsap.set("#c4-g2-sl2,#c4-g2-sr2,#c4-g2-sr3,#c4-g2-start,#c4-g2-stl", { opacity: 0 });
      gsap.set("#c4-g2-hkl", { x: mL.X(0.12), y: mL.Y(0.12) });
      gsap.set("#c4-g2-hkr", { x: mR.X(0.12), y: mR.Y(0.12) });
      pop("#c4-g2-hkl", T3 + 0.8); pop("#c4-g2-hkr", T3 + 0.9);
      tl.fromTo("#c4-g2-slope", { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.5, ease: "power3.out" }, T3 + 2.2);
